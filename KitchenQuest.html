<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kitchen Quest">
<title>Kitchen Quest — 台所迷宮</title>
<style>
  :root{
    --bg:#05070d; --panel:rgba(12,26,48,0.55); --panel2:rgba(16,34,60,0.6); --line:rgba(90,180,255,0.35);
    --line-bright:#7fc8ff; --ink:#dceeff; --sub:#5a86b8;
    --sys:#7fc8ff; --sys-deep:#38a0dd; --sys-glow:rgba(127,200,255,0.6);
    --hp:#6ee7c8; --hp-deep:#2fbf9a; --hp-glow:rgba(110,231,200,0.55);
    --warn:#ffa94d; --warn-deep:#e08828; --warn-glow:rgba(255,169,77,0.55);
    --danger:#ff6a5a; --danger-deep:#e0483a; --danger-glow:rgba(255,106,90,0.6);
    --gold:#e7b84f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:radial-gradient(130% 55% at 50% -8%, rgba(56,138,221,0.22) 0%, transparent 62%), var(--bg);
    color:var(--ink); font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    min-height:100vh; padding:16px 14px 40px; max-width:460px;margin:0 auto; letter-spacing:.02em;
    position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(90,180,255,0.022) 3px,transparent 4px);
  }
  body>*{position:relative;z-index:1;}

  /* ---- ヘッダー：システムウィンドウ ---- */
  .crest{display:flex;align-items:center;gap:12px;padding:8px 16px;position:relative;
    border:1.5px solid var(--line);border-radius:4px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    box-shadow:0 0 24px rgba(56,138,221,0.28), inset 0 0 30px rgba(56,138,221,0.06);}
  .crest::before,.crest::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;}
  .crest::before{top:-1px;left:-1px;border-top:2px solid var(--sys);border-left:2px solid var(--sys);box-shadow:-1px -1px 8px var(--sys-glow);}
  .crest::after{top:-1px;right:-1px;border-top:2px solid var(--sys);border-right:2px solid var(--sys);box-shadow:1px -1px 8px var(--sys-glow);}
  .crest .corners::before,.crest .corners::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;}
  .crest .corners::before{bottom:-1px;left:-1px;border-bottom:2px solid var(--sys);border-left:2px solid var(--sys);box-shadow:-1px 1px 8px var(--sys-glow);}
  .crest .corners::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--sys);border-right:2px solid var(--sys);box-shadow:1px 1px 8px var(--sys-glow);}
  .emblem{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 6px var(--sys-glow));}
  .crest h1{font-size:clamp(15px,5.2vw,20px);font-weight:800;letter-spacing:.1em;white-space:nowrap;text-shadow:0 0 10px var(--sys-glow);}

  /* ---- タブ ---- */
  .tabs{display:flex;gap:6px;margin:14px 0 10px;overflow-x:auto;padding-bottom:2px;}
  .tab{flex:none;padding:8px 13px;border-radius:3px;border:1px solid var(--line);background:var(--panel);
    color:var(--sub);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;}
  .tab.active{background:rgba(20,44,78,0.55);color:var(--sys);border-color:var(--sys);
    box-shadow:0 0 12px rgba(56,138,221,0.3),inset 0 0 12px rgba(56,138,221,0.1);text-shadow:0 0 6px var(--sys-glow);}
  .tab .n{opacity:.6;font-weight:500;margin-left:3px;}
  .tab.buy.active{color:var(--danger);border-color:var(--danger);box-shadow:0 0 12px var(--danger-glow);text-shadow:0 0 6px var(--danger-glow);}

  /* ---- ステータス ---- */
  .status{display:flex;gap:6px;margin:2px 2px 12px;}
  .stat{flex:1;border:1px solid var(--line);border-radius:3px;background:rgba(20,44,78,0.3);
    padding:5px 6px;display:flex;align-items:center;justify-content:center;gap:5px;}
  .stat .mk{font-size:10px;font-weight:900;font-family:"Segoe UI",system-ui;opacity:.85;}
  .stat b{font-size:16px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
  .stat.sF{border-color:rgba(127,200,255,0.45);background:rgba(20,44,78,0.35);}
  .stat.sF .mk,.stat.sF b{color:var(--sys);text-shadow:0 0 8px var(--sys-glow);}
  .stat.sG{border-color:rgba(110,231,200,0.42);background:rgba(20,60,54,0.3);}
  .stat.sG .mk,.stat.sG b{color:var(--hp);text-shadow:0 0 8px var(--hp-glow);}
  .stat.sL{border-color:rgba(255,169,77,0.45);background:rgba(48,34,14,0.32);}
  .stat.sL .mk,.stat.sL b{color:var(--warn);text-shadow:0 0 8px var(--warn-glow);}
  .stat.sE{border-color:rgba(255,106,90,0.45);background:rgba(60,22,22,0.32);}
  .stat.sE .mk,.stat.sE b{color:var(--danger);text-shadow:0 0 8px var(--danger-glow);}

  /* ---- モブ（品目行） ---- */
  .roster{display:flex;flex-direction:column;gap:9px;}
  .mob{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-left:3px solid var(--sys);border-radius:3px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));padding:11px 12px;position:relative;
    overflow:hidden;transition:opacity .25s, filter .25s;box-shadow:inset 0 0 16px rgba(56,138,221,0.05);}
  /* 警戒＝オレンジ */
  .mob.warn-stock{border-color:var(--warn);border-left-color:var(--warn);
    background:linear-gradient(180deg,rgba(48,34,14,0.6),rgba(30,22,10,0.6));box-shadow:inset 0 0 16px rgba(255,169,77,0.08);}
  /* 危険＝赤 */
  .mob.low-stock{border-color:var(--danger);border-left-color:var(--danger);
    background:linear-gradient(180deg,rgba(48,18,18,0.65),rgba(30,12,12,0.65));
    box-shadow:inset 0 0 16px rgba(255,106,90,0.1),0 0 12px rgba(255,106,90,0.15);}
  .meta{flex:1;min-width:0;}
  .meta .nm{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mob.warn-stock .nm{color:#ffdcae;}
  .mob.low-stock .nm{color:#ffd0ca;}
  .buyflag{font-size:9px;letter-spacing:.05em;border-radius:3px;padding:1.5px 6px;margin-right:6px;
    font-weight:800;color:var(--danger);border:1px solid var(--danger);vertical-align:1px;}
  .tierbadge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:18px;
    font-size:11px;font-weight:900;border-radius:3px;margin-right:7px;vertical-align:1px;
    border:1px solid transparent;font-family:"Segoe UI",system-ui,sans-serif;letter-spacing:0;flex:none;}
  .tierbadge.rS{background:rgba(127,200,255,.14);color:var(--sys);border-color:rgba(127,200,255,.5);
    text-shadow:0 0 6px var(--sys-glow);box-shadow:0 0 6px rgba(56,138,221,.25);}
  .tierbadge.rA{background:rgba(110,231,200,.14);color:var(--hp);border-color:rgba(110,231,200,.5);
    text-shadow:0 0 6px var(--hp-glow);box-shadow:0 0 6px rgba(47,191,154,.22);}
  .tierbadge.rG{background:rgba(255,169,77,.14);color:var(--warn);border-color:rgba(255,169,77,.5);
    text-shadow:0 0 6px var(--warn-glow);box-shadow:0 0 6px rgba(224,136,40,.22);}
  .step{display:flex;align-items:center;gap:6px;flex:none;}
  .qty{min-width:46px;text-align:center;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;}
  .qty small{font-size:10px;color:var(--sub);font-weight:600;display:block;}
  .btn{width:32px;height:32px;border-radius:4px;border:1px solid var(--line);background:rgba(8,16,28,0.8);color:var(--ink);
    font-size:19px;font-weight:800;display:grid;place-items:center;cursor:pointer;user-select:none;
    transition:transform .06s, background .15s, border-color .15s;}
  .btn:active{transform:scale(.86);}
  .btn.minus:active{background:rgba(224,72,58,0.35);border-color:var(--danger);}
  .btn.plus:active{background:rgba(56,138,221,0.4);border-color:var(--sys);}

  /* ---- スライダー（%ゲージ） ---- */
  .gauge{width:100%;height:5px;border-radius:3px;background:rgba(8,16,28,0.8);border:1px solid var(--line);
    margin-top:5px;overflow:hidden;}
  .gauge-fill{height:100%;background:var(--sys);transition:width .25s;}
  .gauge-fill.low{background:var(--danger);}
  .stock-slider{-webkit-appearance:none;appearance:none;display:block;width:100%;height:6px;border-radius:3px;
    background:linear-gradient(90deg,var(--sys-deep) 0%,var(--sys) var(--p,50%),rgba(8,16,28,0.85) var(--p,50%));
    border:1px solid var(--line);margin-top:8px;cursor:pointer;touch-action:none;
    box-shadow:0 0 6px rgba(56,138,221,0.3);}
  .stock-slider.warn{background:linear-gradient(90deg,var(--warn-deep) 0%,var(--warn) var(--p,50%),rgba(8,16,28,0.85) var(--p,50%));box-shadow:0 0 6px rgba(255,169,77,0.35);}
  .stock-slider.low{background:linear-gradient(90deg,var(--danger-deep) 0%,var(--danger) var(--p,50%),rgba(8,16,28,0.85) var(--p,50%));box-shadow:0 0 6px rgba(255,106,90,0.35);}
  .stock-slider::-webkit-slider-thumb{-webkit-appearance:none;width:5px;height:20px;border-radius:2px;
    background:var(--ink);border:none;box-shadow:0 0 8px var(--sys-glow),0 0 2px var(--sys);}
  .stock-slider.warn::-webkit-slider-thumb{background:#fff2e0;box-shadow:0 0 8px var(--warn-glow),0 0 2px var(--warn);}
  .stock-slider.low::-webkit-slider-thumb{background:#ffe6e2;box-shadow:0 0 8px var(--danger-glow),0 0 2px var(--danger);}
  .stock-slider::-moz-range-thumb{width:5px;height:20px;border-radius:2px;background:var(--ink);
    border:none;box-shadow:0 0 8px var(--sys-glow),0 0 2px var(--sys);}
  .stock-slider.warn::-moz-range-thumb{background:#fff2e0;box-shadow:0 0 8px var(--warn-glow),0 0 2px var(--warn);}
  .stock-slider.low::-moz-range-thumb{background:#ffe6e2;box-shadow:0 0 8px var(--danger-glow),0 0 2px var(--danger);}

  /* ---- EMPTY（在庫0） ---- */
  .mob.dead{opacity:.4;filter:grayscale(.7);border-left-color:#3a5578;}
  .mob.dead .nm{text-decoration:line-through;}
  .slain{position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(-8deg);font-size:10px;font-weight:900;
    letter-spacing:.12em;color:var(--sys);border:1.5px solid var(--sys);border-radius:3px;padding:2px 7px;
    opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 0 6px var(--sys-glow);box-shadow:0 0 8px var(--sys-glow);}
  .mob.dead .slain{opacity:1;}
  @keyframes hit{0%{background:rgba(255,106,90,.25);}100%{background:transparent;}}
  .mob.hit{animation:hit .35s;}

  /* ---- 買い出しリスト ---- */
  .buygrouptitle{font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:.08em;margin:14px 2px 8px;
    display:flex;align-items:center;gap:8px;}
  .buygrouptitle:first-child{margin-top:2px;}
  .buygrouptitle::before,.buygrouptitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);}
  .buygrouptitle.must{color:var(--danger);text-shadow:0 0 6px var(--danger-glow);}
  .buyrow{display:flex;align-items:center;gap:12px;border:1px solid var(--danger);border-left:3px solid var(--danger);border-radius:3px;
    background:linear-gradient(180deg,rgba(48,20,18,0.6),rgba(28,12,12,0.6));padding:12px 13px;margin-bottom:9px;
    box-shadow:inset 0 0 14px rgba(255,106,90,0.08);}
  .buyrow.mood{border-color:var(--warn);border-left-color:var(--warn);background:linear-gradient(180deg,rgba(48,34,14,0.55),rgba(28,20,10,0.55));box-shadow:inset 0 0 14px rgba(255,169,77,0.08);}
  .buyrow.mood .left{color:var(--warn);}
  .buyrow .icon{border-color:var(--danger);}
  .buyrow .nm{font-size:14px;font-weight:800;}
  .buyrow .nt{font-size:11px;color:var(--sub);margin-top:2px;}
  .buyrow .left{margin-left:auto;text-align:right;font-size:11px;color:var(--danger);font-weight:800;}
  .empty{text-align:center;color:var(--sub);font-size:12.5px;padding:30px 10px;line-height:1.8;}
  .empty b{color:var(--hp);text-shadow:0 0 6px var(--hp-glow);}

  /* ---- フッター ---- */
  .foot{margin-top:20px;text-align:center;font-size:10.5px;color:var(--sub);line-height:1.7;letter-spacing:.05em;}
  .copyright{margin-top:8px;text-align:center;font-size:9.5px;color:#3a5a80;letter-spacing:.14em;}
  .copyright .ver{color:var(--sys);text-shadow:0 0 6px var(--sys-glow);}
  .foot b{color:var(--sys);font-weight:700;}
  .note{margin-top:14px;border:1px solid var(--line);border-radius:3px;padding:11px 13px;font-size:11px;
    color:var(--sub);line-height:1.75;background:rgba(20,44,78,0.2);position:relative;}
  .note b{color:var(--sys);}

  /* ---- モーダル：システム通知 ---- */
  .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(2,4,8,.82);z-index:9999;place-items:center;justify-content:center;}
  .modal.show{display:grid;}
  .modal-content{position:relative;background:linear-gradient(180deg,rgba(12,26,48,0.96),rgba(6,14,28,0.96));
    border:1.5px solid var(--sys);border-radius:4px;padding:22px 20px;width:90%;max-width:420px;
    box-shadow:0 0 40px rgba(56,138,221,0.4),inset 0 0 40px rgba(56,138,221,0.06);}
  .modal-content::before,.modal-content::after{content:"";position:absolute;width:20px;height:20px;pointer-events:none;}
  .modal-content::before{top:-1px;left:-1px;border-top:2px solid var(--sys);border-left:2px solid var(--sys);box-shadow:-1px -1px 10px var(--sys-glow);}
  .modal-content::after{top:-1px;right:-1px;border-top:2px solid var(--sys);border-right:2px solid var(--sys);box-shadow:1px -1px 10px var(--sys-glow);}
  .modal-title{font-size:16px;font-weight:900;color:var(--sys);letter-spacing:.14em;margin-bottom:16px;text-align:center;
    text-shadow:0 0 12px var(--sys-glow);border:1px solid var(--line);border-radius:3px;padding:8px;
    background:rgba(20,44,78,0.35);}
  .modal-form{display:flex;flex-direction:column;gap:12px;}
  .form-group{display:flex;flex-direction:column;gap:4px;}
  .form-group label{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.08em;}
  .form-group input,.form-group select{background:rgba(8,16,28,0.7);border:1px solid var(--line);border-radius:3px;padding:8px 10px;color:var(--ink);font-family:inherit;font-size:13px;}
  .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--sys);box-shadow:0 0 12px rgba(56,138,221,0.35);}
  .form-actions{display:flex;gap:8px;margin-top:12px;}
  .form-actions button{flex:1;padding:10px;border-radius:3px;border:1px solid var(--line);font-weight:700;font-size:12px;cursor:pointer;transition:all .2s;letter-spacing:.05em;}
  .form-actions .btn-ok{background:rgba(56,138,221,0.25);color:var(--sys);border-color:var(--sys);text-shadow:0 0 6px var(--sys-glow);}
  .form-actions .btn-ok:active{transform:scale(.95);}
  .form-actions .btn-cancel{background:transparent;color:var(--sub);}
  .btn-add-item{margin-left:auto;padding:6px 12px;border:1px solid var(--sys);border-radius:3px;background:rgba(20,44,78,0.4);color:var(--sys);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.05em;text-shadow:0 0 6px var(--sys-glow);box-shadow:0 0 10px rgba(56,138,221,0.2);}
  .btn-add-item:active{transform:scale(.95);}

  /* ---- 表示軸トグル ---- */
  .modebar{display:flex;align-items:center;gap:10px;margin:14px 0 2px;}
  .modetoggle{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .modeopt{padding:6px 11px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;transition:all .15s;background:transparent;white-space:nowrap;}
  .modeopt+.modeopt{border-left:1px solid var(--line);}
  .modeopt.active{color:var(--sys);background:rgba(56,138,221,0.28);box-shadow:inset 0 0 12px rgba(56,138,221,0.15);text-shadow:0 0 6px var(--sys-glow);}
  /* タブ内のランクマーク（S/A/G） */
  .tab .rankmark{display:inline-flex;align-items:center;justify-content:center;width:17px;height:15px;
    font-size:10px;font-weight:900;border-radius:2px;margin-right:5px;border:1px solid currentColor;
    font-family:"Segoe UI",system-ui;vertical-align:1px;opacity:.9;}
  /* 品目行の現在地ラベル（ランクモード） */
  .catloc{font-size:10px;color:var(--sub);margin-top:2px;letter-spacing:.05em;}
  .mob.warn-stock .catloc{color:#c99a5a;}
  .mob.low-stock .catloc{color:#a35a54;}
</style>
</head>
<body>

  <div class="crest">
    <span class="corners"></span>
    <div class="emblem" aria-label="Kitchen Quest">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#7fc8ff" stroke-width="2.4"/>
        <circle cx="50" cy="50" r="40" fill="none" stroke="#7fc8ff" stroke-width="1" opacity="0.5"/>
        <g stroke="#7fc8ff" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <g transform="rotate(-22 50 50)">
            <line x1="50" y1="26" x2="50" y2="74" stroke-width="3"/>
            <path d="M 50,26 L 50,40" stroke-width="7"/>
          </g>
          <g transform="rotate(22 50 50)">
            <line x1="50" y1="40" x2="50" y2="74" stroke-width="3"/>
            <path d="M 46,24 L 46,34 M 50,24 L 50,34 M 54,24 L 54,34" stroke-width="2"/>
            <path d="M 46,34 Q 50,40 54,34" stroke-width="2"/>
          </g>
        </g>
      </svg>
    </div>
    <h1>KITCHEN QUEST</h1>
  </div>

  <div class="modebar">
    <div class="modetoggle" id="modeToggle">
      <div class="modeopt" data-mode="all">▤ ALL</div>
      <div class="modeopt" data-mode="rank">⬢ RANK</div>
      <div class="modeopt active" data-mode="place">⊞ AREA</div>
    </div>
  </div>

  <div style="display:flex;align-items:center;margin:10px 0;">
    <div class="tabs" id="tabs" style="flex:1;"></div>
    <button class="btn-add-item" id="btnAddItem">＋ 未知の品目</button>
  </div>

  <div id="statusWrap" class="status">
    <div class="stat sF" id="s-full"><span class="mk">F</span><b>0</b></div>
    <div class="stat sG" id="s-good"><span class="mk">G</span><b>0</b></div>
    <div class="stat sL" id="s-low"><span class="mk">L</span><b>0</b></div>
    <div class="stat sE" id="s-empty"><span class="mk">E</span><b>0</b></div>
  </div>

  <div class="roster" id="roster"></div>

  <div class="note" id="footNote">
    <b style="color:var(--danger)">−</b> で消費 ／ <b style="color:var(--sys)">＋</b> で補充。0になると「EMPTY」。％ゲージは<b>スライダーで直接調整</b>（5%刻み）。<br>
    在庫の色 ── <b style="color:var(--sys)">青＝通常</b> ／ <b style="color:var(--warn)">橙＝警戒</b> ／ <b style="color:var(--danger)">赤＝危険（残りわずか）</b>。<br>
    ※数値はこの端末・このブラウザ内だけに保存されます（localStorage）。他端末とは同期しません。<br>
    ※絵文字は品目ごとに手動設定。未設定の新規モブは既定で📦が表示されます。
  </div>

  <div class="foot" id="footTag"></div>
  <div class="copyright">KITCHEN QUEST <span class="ver">v1.1</span> ── © 2026 muukun</div>

  <div class="modal" id="addItemModal">
    <div class="modal-content">
      <div class="modal-title">❌ 未知の品目を検出</div>
      <div class="modal-form">
        <div class="form-group">
          <label>絵文字</label>
          <input type="text" id="itemIcon" maxlength="2" placeholder="🐟" value="📦">
        </div>
        <div class="form-group">
          <label>品名</label>
          <input type="text" id="itemName" placeholder="新しい品目">
        </div>
        <div class="form-group">
          <label>数量</label>
          <input type="number" id="itemQty" value="1" min="0">
        </div>
        <div class="form-group">
          <label>単位</label>
          <input type="text" id="itemUnit" placeholder="個 / 缶 / ml など">
        </div>
        <div class="form-group">

      {ic:"🍯", nm:"はちみつ", nt:"", qty:100, unit:"%", pri:"low", tier:1, warn:10},
      {ic:"🧻", nm:"ドリップペーパー", nt:"", qty:30, unit:"%", pri:"low", tier:1, warn:10},
      {ic:"🧻", nm:"キッチンペーパー", nt:"", qty:100, unit:"%", pri:"low", tier:1, warn:10},
      {ic:"🥫", nm:"シナモン", nt:"", qty:100, unit:"%", pri:"low", tier:1, warn:10},
      {ic:"🥫", nm:"味の素", nt:"", qty:60, unit:"%", pri:"low", tier:1, warn:10},
      {ic:"🌿", nm:"わかめ", nt:"", qty:50, unit:"%", pri:"low", tier:1, warn:10},
      {ic:"🥫", nm:"コンソメ", nt:"", qty:5, unit:"本", pri:"low", tier:1, warn:1},
      {ic:"🫒", nm:"オリーブオイル", nt:"", qty:190, unit:"%", pri:"low", tier:1},
      {ic:"🐟", nm:"鯖缶", nt:"※テーブルの脚を支える什器", qty:1, unit:"缶", pri:"low", tier:9, warn:0},
    ],
    "その他": [
      {ic:"🫑", nm:"パプリカ", nt:"", qty:3, unit:"個", pri:"high", tier:9, warn:0},
    ],
  };

  const tierJP = {1:"常駐", 2:"常連", 3:"ゲスト"};
  // ランク定義: tier番号 → {文字, ラベル, CSS色クラス}
  // 将来ABCを間に足すときは 3:{mark:"B",...}, 4:{mark:"C",...} を追記するだけ。
  // ゲストは末尾固定(tier=9)。ソートはtier番号順なので S→A→…→G が自然に保たれる。
  const RANKS = {
    1: {mark:"S", jp:"常駐",   cls:"rS"},   // 青
    2: {mark:"A", jp:"常連",   cls:"rA"},   // 緑
    9: {mark:"G", jp:"ゲスト", cls:"rG"},   // 橙
  };
  const RANK_FALLBACK = {mark:"A", jp:"常連", cls:"rA"};
  function rankOf(mob){ return RANKS[mob && mob.tier] || RANK_FALLBACK; }
  // 全カテゴリの品目を {cat, mob, i}（i=そのカテゴリ内index）で列挙。カスタム品も含む。
  function allEntries(){
    const out = [];
    Object.keys(DATA).forEach(cat=>{
      const base = DATA[cat] || [];
      const cust = (customItems[cat] || []);
      const merged = [...base, ...cust];
      merged.forEach((mob,i)=> out.push({cat, mob, i}));
    });
    return out;
  }
  const CATS = Object.keys(DATA);
  const BUY_TAB = "買い出し候補";
  // 場所ごとの絵文字（ランクモードで各行に現在地を表示）
  const CAT_ICON = {"冷蔵庫":"❄", "冷凍庫":"🧊", "パントリー":"📦", "その他":"🔖"};
  // 表示軸モード: "place"(場所) / "rank"(ランク)
  let viewMode = "place";
  // ランクモードのタブ（RANKSのキー順＝S,A,…,G）。買い出しは共通で末尾。
  const RANK_TABS = Object.keys(RANKS).map(Number).sort((a,b)=>a-b); // [1,2,9]
  let currentRank = RANK_TABS[0]; // ランクモードで選択中のランク番号
  const BUY_THRESHOLD = 1; // 既定の警戒ライン（品目ごとに warn で上書き可）
  function warnOf(mob){ return (typeof mob.warn === "number") ? mob.warn : BUY_THRESHOLD; }
  // 在庫レベル判定: "dead"(0) / "low"(危険=warnの1/4以下) / "warn"(警戒=warn以下) / "ok"(通常)
  function stockLevel(q, mob){
    const w = warnOf(mob);
    if(q <= 0) return "dead";
    if(q > w) return "ok";
    // ここに来る時点で 0 < q <= w（買い出し候補）
    if(q <= Math.max(1, w/4)) return "low";   // 危険＝赤（warnの1/4以下）
    return "warn";                             // 警戒＝オレンジ
  }
  let current = CATS[0];

  const STORE_KEY = "kitchenQuest_v2_state";
  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return {};
      return JSON.parse(raw);
    }catch(e){ return {}; }
  }
  function saveState(state){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }
  let state = loadState();
  let customItems = loadCustomItems();
  let currentList = []; // 現在のカテゴリの標準+カスタム品目マージリスト
  
  function loadCustomItems(){
    try{
      const raw = localStorage.getItem("kitchenQuest_customItems");
      if(!raw) return {};
      return JSON.parse(raw);
    }catch(e){ return {}; }
  }
  function saveCustomItems(){
    try{ localStorage.setItem("kitchenQuest_customItems", JSON.stringify(customItems)); }catch(e){}
  }
  
  function openAddItemModal(){ document.getElementById("addItemModal").classList.add("show"); }
  function closeAddItemModal(){ document.getElementById("addItemModal").classList.remove("show"); }
  window.closeAddItemModal = closeAddItemModal;
  
  function submitNewItem(){
    const ic = document.getElementById("itemIcon").value.trim() || "📦";
    const nm = document.getElementById("itemName").value.trim();
    const qty = +document.getElementById("itemQty").value || 1;
    const unit = document.getElementById("itemUnit").value.trim() || "";
    const cat = document.getElementById("itemCat").value;
    const tier = +document.getElementById("itemTier").value || 2;
    const warn = +document.getElementById("itemWarn").value || 0;
    
    if(!nm){ alert("品名を入力してください"); return; }
    
    const newItem = {ic, nm, nt:"", qty, unit, pri:"low", tier, warn};
    if(!customItems[cat]) customItems[cat] = [];
    customItems[cat].push(newItem);
    saveCustomItems();
    closeAddItemModal();
    render();
    alert("🎉 " + nm + " を台所に追加しました！");
  }
  window.submitNewItem = submitNewItem;
  
  function keyOf(cat,i){ return cat+"::"+i; }
  function getQty(cat,i,mob){
    const k = keyOf(cat,i);
    return (k in state) ? state[k] : mob.qty;
  }
  function setQty(cat,i,v){
    state[keyOf(cat,i)] = v;
    saveState(state);
  }

  // ---- タブ描画 ----
  const tabsEl = document.getElementById("tabs");
  function renderTabs(){
    tabsEl.innerHTML = "";
    if(viewMode === "place"){
      CATS.forEach(cat=>{
        const t = document.createElement("div");
        t.className = "tab" + (current===cat && current!==BUY_TAB ? " active" : "");
        const count = (DATA[cat].length) + (customItems[cat]?.length || 0);
        t.innerHTML = `${cat}<span class="n">${count}</span>`;
        t.onclick = ()=>{ current = cat; render(); };
        tabsEl.appendChild(t);
      });
    } else if(viewMode === "rank"){
      // ランクモード：S / A / … / G
      RANK_TABS.forEach(rk=>{
        const r = RANKS[rk];
        const t = document.createElement("div");
        t.className = "tab" + (current!==BUY_TAB && currentRank===rk ? " active" : "");
        const count = allEntries().filter(e=>(e.mob.tier|| 2)===rk).length;
        t.innerHTML = `<span class="rankmark ${r.cls}">${r.mark}</span>${r.jp}<span class="n">${count}</span>`;
        t.onclick = ()=>{ current = "__RANK__"; currentRank = rk; render(); };
        tabsEl.appendChild(t);
      });
    } else {
      // ALLモード：全品目まとめて1タブ
      const t = document.createElement("div");
      t.className = "tab" + (current!==BUY_TAB ? " active" : "");
      t.innerHTML = `▤ ALL<span class="n">${allEntries().length}</span>`;
      t.onclick = ()=>{ current = "__ALL__"; render(); };
      tabsEl.appendChild(t);
    }
    const buyCount = countBuyList();
    const bt = document.createElement("div");
    bt.className = "tab buy" + (current===BUY_TAB ? " active" : "");
    bt.innerHTML = `🛒 買い出し候補<span class="n">${buyCount}</span>`;
    bt.onclick = ()=>{ current = BUY_TAB; render(); };
    tabsEl.appendChild(bt);
  }

  function countBuyList(){
    let n = 0;
    CATS.forEach(cat=>{
      const full = [...DATA[cat], ...(customItems[cat]||[])];
      full.forEach((mob,i)=>{
        if(getQty(cat,i,mob) <= warnOf(mob)) n++;
      });
    });
    return n;
  }

  // ---- ロスター描画 ----
  const roster = document.getElementById("roster");
  const statusWrap = document.getElementById("statusWrap");
  const footNote = document.getElementById("footNote");

  function renderRoster(){
    roster.innerHTML = "";
    // 場所モード時：currentカテゴリの品目リスト（標準+カスタム）
    const baseList = DATA[current] || [];
    const customList = customItems[current] || [];
    currentList = [...baseList, ...customList];
    
    if(current === BUY_TAB){
      statusWrap.style.display = "none";
      footNote.style.display = "none";
      const items = [];
      CATS.forEach(cat=>{
        DATA[cat].forEach((mob,i)=>{
          const q = getQty(cat,i,mob);
          if(q <= warnOf(mob)) items.push({cat,mob,q});
        });
      });
      if(items.length===0){
        roster.innerHTML = `<div class="empty">在庫は十分。<br><b>買い出し候補は、今のところなし。</b><br>各品の"警戒ライン"を下回ると、ここに浮かび上がります。</div>`;
        return;
      }
      function tierOf(mob){ return mob.tier || 2; }
      const g1 = items.filter(x=>tierOf(x.mob)===1).sort((a,b)=> a.q - b.q);
      const g2 = items.filter(x=>tierOf(x.mob)===2).sort((a,b)=> a.q - b.q);
      const g3 = items.filter(x=>tierOf(x.mob)!==1 && tierOf(x.mob)!==2).sort((a,b)=> a.q - b.q);

      function renderGroup(title, arr, tone){
        if(arr.length===0) return;
        const h = document.createElement("div");
        h.className = "buygrouptitle" + (tone ? " "+tone : "");
        h.textContent = title;
        roster.appendChild(h);
        arr.forEach(({cat,mob,q})=>{
          const el = document.createElement("div");
          el.className = "buyrow" + (tone==="mood" ? " mood" : "");
          el.innerHTML = `
            <div>
              <div class="nm">${mob.nm}</div>
              <div class="nt">${cat}</div>
            </div>
            <div class="left">残り${q}${mob.unit||""}</div>`;
          roster.appendChild(el);
        });
      }
      renderGroup("🔴 常駐（切らすと即困る・主力）", g1, "must");
      renderGroup("🟠 常連（よく使う・そこそこ急ぎ）", g2, "");
      renderGroup("🟡 ゲスト（気分次第・お気に入り枠）", g3, "mood");
      return;
    }

    statusWrap.style.display = "flex";
    footNote.style.display = "block";
    statusWrap.style.display = "flex";
    footNote.style.display = "block";

    // 表示する {cat, mob, i} のリストを、モードに応じて用意
    let entries;
    let showCatLabel = false;
    if(viewMode === "rank"){
      // ランクモード：全場所から選択中ランクの品目を集約
      entries = allEntries().filter(e => (e.mob.tier || 2) === currentRank);
      showCatLabel = true; // 各行に現在地を表示
      // 並び：場所→元index の順で安定させる
      const catOrder = {}; CATS.forEach((c,idx)=> catOrder[c]=idx);
      entries.sort((a,b)=>{
        if(catOrder[a.cat] !== catOrder[b.cat]) return catOrder[a.cat] - catOrder[b.cat];
        return a.i - b.i;
      });
    } else if(viewMode === "all"){
      // ALLモード：全品目を場所順→tier順で
      entries = allEntries();
      showCatLabel = true;
      const catOrder = {}; CATS.forEach((c,idx)=> catOrder[c]=idx);
      entries.sort((a,b)=>{
        if(catOrder[a.cat] !== catOrder[b.cat]) return catOrder[a.cat] - catOrder[b.cat];
        const ta = a.mob.tier || 2, tb = b.mob.tier || 2;
        if(ta !== tb) return ta - tb;
        return a.i - b.i;
      });
    } else {
      // 場所モード：現在カテゴリの品目を tier順で
      entries = currentList.map((mob,i)=>({cat:current, mob, i}));
      entries.sort((a,b)=>{
        const ta = a.mob.tier || 2, tb = b.mob.tier || 2;
        if(ta !== tb) return ta - tb;
        return a.i - b.i;
      });
    }

    entries.forEach(({cat,mob,i})=>{
      const q = getQty(cat,i,mob);
      const lvl = stockLevel(q, mob);          // ok / warn / low / dead
      const stateCls = lvl==="warn" ? " warn-stock" : lvl==="low" ? " low-stock" : lvl==="dead" ? " dead" : "";
      const sliderCls = lvl==="warn" ? " warn" : lvl==="low" ? " low" : "";
      const el = document.createElement("div");
      el.className = "mob" + stateCls;
      el.dataset.i = i;
      el.dataset.cat = cat;
      const catLabel = showCatLabel ? `<div class="catloc">${CAT_ICON[cat]||""} ${cat}</div>` : "";
      el.innerHTML = `
        <div class="meta">
          <div class="nm"><span class="tierbadge ${rankOf(mob).cls}" title="${rankOf(mob).jp}">${rankOf(mob).mark}</span>${mob.nm}</div>
          ${catLabel}
          ${mob.unit==="%" ? (()=>{const mx=Math.max(100,q);return `<input type="range" class="stock-slider${sliderCls}" min="0" max="${mx}" step="5" value="${q}" style="--p:${(q/mx*100)}%">`})() : ""}
        </div>
        <div class="step">
          <div class="btn minus" data-act="-1">−</div>
          <div class="qty"><span class="q">${q}</span><small>${mob.unit||""}</small></div>
          <div class="btn plus" data-act="1">＋</div>
        </div>
        <div class="slain">EMPTY</div>`;
      roster.appendChild(el);
    });
    refreshStatus();
  }

  function refreshStatus(){
    let full=0, good=0, low=0, empty=0;
    let list;
    if(viewMode === "rank"){
      list = allEntries().filter(e => (e.mob.tier || 2) === currentRank)
                         .map(e => ({mob:e.mob, cat:e.cat, i:e.i}));
    } else if(viewMode === "all"){
      list = allEntries().map(e => ({mob:e.mob, cat:e.cat, i:e.i}));
    } else {
      list = currentList.map((mob,i)=>({mob, cat:current, i}));
    }
    list.forEach(({mob,cat,i})=>{
      const q = getQty(cat,i,mob);
      const w = warnOf(mob);
      if(q <= 0) empty++;              // E 空（赤）
      else if(q <= w) low++;           // L 不足（オレンジ）
      else if(q <= w*2) good++;        // G 充足（緑）
      else full++;                     // F 充分（青）
    });
    document.querySelector("#s-full b").textContent = full;
    document.querySelector("#s-good b").textContent = good;
    document.querySelector("#s-low b").textContent = low;
    document.querySelector("#s-empty b").textContent = empty;
  }

  // 行要素から {cat, i, mob} を取り出す共通関数（場所/ランク両モード対応）
  function entryFromEl(mobEl){
    const cat = mobEl.dataset.cat;
    const i = +mobEl.dataset.i;
    const merged = [...(DATA[cat]||[]), ...((customItems[cat]||[]))];
    return {cat, i, mob: merged[i]};
  }

  roster.addEventListener("click", e=>{
    const btn = e.target.closest(".btn");
    if(!btn) return;
    const mobEl = btn.closest(".mob");
    const {cat,i,mob} = entryFromEl(mobEl);
    if(!mob) return;
    const step = mob.step || 1;
    const dir = +btn.dataset.act; // -1 or 1
    let v = getQty(cat,i,mob) + (dir * step);
    if(v<0) v=0;
    setQty(cat,i,v);
    render(); // 数値・バッジ・買い出し候補・危険域を丸ごと再計算
  });

  // ---- %スライダー：ドラッグ中は表示だけ更新、指を離したら保存＆再描画 ----
  roster.addEventListener("input", e=>{
    const s = e.target.closest(".stock-slider");
    if(!s) return;
    const mobEl = s.closest(".mob");
    const {mob} = entryFromEl(mobEl);
    const q = +s.value, mx = +s.max;
    s.style.setProperty("--p", (q/mx*100)+"%");
    const qEl = mobEl.querySelector(".q");
    if(qEl) qEl.textContent = q;
    // ドラッグ中も警戒/危険の色をリアルタイム反映
    const lvl = stockLevel(q, mob);
    s.classList.remove("warn","low");
    if(lvl==="warn") s.classList.add("warn");
    else if(lvl==="low") s.classList.add("low");
    mobEl.classList.remove("warn-stock","low-stock","dead");
    if(lvl==="warn") mobEl.classList.add("warn-stock");
    else if(lvl==="low") mobEl.classList.add("low-stock");
    else if(lvl==="dead") mobEl.classList.add("dead");
  });
  roster.addEventListener("change", e=>{
    const s = e.target.closest(".stock-slider");
    if(!s) return;
    const mobEl = s.closest(".mob");
    const {cat,i} = entryFromEl(mobEl);
    setQty(cat, i, +s.value);
    render();
  });

  function render(){
    renderTabs();
    renderRoster();
    let footLabel;
    if(current===BUY_TAB){
      footLabel = "在庫が薄いものを自動で炙り出す、警戒リスト";
    } else if(viewMode==="rank"){
      const r = RANKS[currentRank] || RANK_FALLBACK;
      footLabel = `${r.mark} ${r.jp} ── 全エリア横断`;
    } else if(viewMode==="all"){
      footLabel = `全品目 ── 台所のすべて`;
    } else {
      footLabel = `${current}`;
    }
    document.getElementById("footTag").textContent = footLabel;
  }

  document.getElementById("btnAddItem").addEventListener("click", openAddItemModal);

  // ---- 表示軸トグル ----
  document.getElementById("modeToggle").addEventListener("click", e=>{
    const opt = e.target.closest(".modeopt");
    if(!opt) return;
    const mode = opt.dataset.mode;
    if(mode === viewMode) return;
    viewMode = mode;
    // トグルの見た目更新
    document.querySelectorAll("#modeToggle .modeopt").forEach(o=>{
      o.classList.toggle("active", o.dataset.mode === viewMode);
    });
    // モード切替時、選択タブを各モードの先頭にリセット（買い出しは維持しない）
    if(viewMode === "place"){ current = CATS[0]; }
    else if(viewMode === "rank"){ current = "__RANK__"; currentRank = RANK_TABS[0]; }
    else { current = "__ALL__"; }
    render();
  });

  render();
</script>
</body>
</html>
